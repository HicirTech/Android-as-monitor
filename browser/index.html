<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android USB Monitor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ddd; font: 20px/1.4 system-ui, sans-serif; }
  [hidden] { display: none !important; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  #start { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border: 0; background: #000; color: inherit; font: inherit; }
  #start strong { font-size: 40px; }
  #hud { position: fixed; left: 12px; top: 12px; padding: 6px 10px; background: rgba(0, 0, 0, 0.65); white-space: pre; font: 16px/1.4 ui-monospace, monospace; pointer-events: none; }
  #exit { position: fixed; right: 16px; top: 16px; padding: 14px 30px; border: 0; border-radius: 10px; background: #c62828; color: #fff; font: 600 24px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<button id="start"><strong>Tap to start</strong><span>The PC must be running aum-companion run --client browser</span></button>
<div id="hud" hidden></div>
<button id="exit" hidden>Exit</button>
<script type="module" src="client.js"></script>
</body>
</html>
